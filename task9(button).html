        .one {

        }

        .two {

        }

        .three {

</head>

    <script>
        function one() {
            p = document.querySelector("p")
            p.className = "one"
        }

        function two() {
            p = document.querySelector("p")
            p.className = "two"
        }

        function three() {
            p = document.querySelector("p")

        }
